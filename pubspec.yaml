name: clever_bill_mobile
description: Clever Bill - Billing, Inventory, Growth (Flutter mobile app)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.1+2
  google_sign_in: ^6.2.1
  mobile_scanner: ^5.2.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  cached_network_image: ^3.4.0
  image_picker: ^1.1.2
  share_plus: 10.1.4
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  printing: 5.13.3
  qr_flutter: ^4.1.0
  razorpay_flutter: ^1.3.7
  stomp_dart_client: ^2.0.0
  local_auth: ^2.3.0
  crypto: ^3.0.3
  print_bluetooth_thermal: ^1.1.4
  esc_pos_utils_plus: ^2.0.3
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Generate launcher icons / splash:  dart run flutter_launcher_icons  &&  dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2A4FE0"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/splash.png
  color_dark: "#0D111D"
  image_dark: assets/icon/icon_foreground.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/splash.png
